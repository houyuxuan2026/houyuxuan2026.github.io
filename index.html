<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>侯雨轩 · 个人主页</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #f8f9fa;
      --card: #ffffff;
      --text: #1a1a2e;
      --text-secondary: #5a5a7a;
      --accent: #4361ee;
      --accent-light: #eef0ff;
      --border: #e2e2ea;
      --tag-bg: #f0f0f5;
      --tag-text: #444;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f0f1a;
        --card: #1a1a2e;
        --text: #e4e4f0;
        --text-secondary: #9898b8;
        --accent: #6b8aff;
        --accent-light: #1e1e3a;
        --border: #2a2a44;
        --tag-bg: #252540;
        --tag-text: #c0c0d8;
      }
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC",
                   "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.7;
      padding: 3rem 1rem;
      min-height: 100vh;
      transition: background 0.3s, color 0.3s;
    }

    .container {
      max-width: 640px;
      margin: 0 auto;
    }

    /* ---- header ---- */
    header {
      text-align: center;
      margin-bottom: 2.5rem;
      animation: fadeUp 0.6s ease-out;
    }

    .avatar {
      width: 80px; height: 80px;
      border-radius: 50%;
      background: var(--accent-light);
      border: 3px solid var(--accent);
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 1rem;
      font-size: 2rem;
      color: var(--accent);
    }

    h1 {
      font-size: 1.8rem;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .tagline {
      font-size: 1rem;
      color: var(--text-secondary);
      margin-top: 0.3rem;
    }

    /* ---- cards ---- */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1.6rem 1.8rem;
      margin-bottom: 1.4rem;
      animation: fadeUp 0.6s ease-out;
      animation-fill-mode: both;
    }
    .card:nth-child(1) { animation-delay: 0.1s; }
    .card:nth-child(2) { animation-delay: 0.25s; }
    .card:nth-child(3) { animation-delay: 0.4s; }

    .card-title {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 0.8rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .card p {
      color: var(--text);
      font-size: 0.95rem;
    }

    .card p + p {
      margin-top: 0.5rem;
    }

    .highlight {
      color: var(--accent);
      font-weight: 600;
    }

    /* ---- tags (爱好的小标签) ---- */
    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-top: 0.5rem;
    }
    .tag {
      background: var(--tag-bg);
      color: var(--tag-text);
      padding: 0.3rem 0.9rem;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 500;
    }

    /* ---- blockquote ---- */
    blockquote {
      margin-top: 0.8rem;
      padding: 0.8rem 1rem;
      border-left: 3px solid var(--accent);
      background: var(--accent-light);
      border-radius: 0 8px 8px 0;
      font-style: italic;
      color: var(--text-secondary);
      font-size: 0.92rem;
    }

    /* ---- footer ---- */
    footer {
      text-align: center;
      font-size: 0.8rem;
      color: var(--text-secondary);
      margin-top: 2.5rem;
      animation: fadeUp 0.6s ease-out 0.55s both;
    }

    /* ---- responsive ---- */
    @media (max-width: 480px) {
      body { padding: 2rem 0.8rem; }
      .card { padding: 1.2rem 1.2rem; }
      h1 { font-size: 1.5rem; }
    }
  </style>
</head>
<body>
  <div class="container">

    <header>
      <div class="avatar">🧑‍💻</div>
      <h1>侯雨轩</h1>
      <p class="tagline">上海高中生</p>
    </header>

    <section class="card">
      <div class="card-title">🙋 关于我</div>
      <p>
        我是侯雨轩，一名上海高中生。
        平时喜欢打打篮球、玩 Minecraft，也爱自己动手折腾点技术的东西。
      </p>
    </section>

    <section class="card">
      <div class="card-title">🎯 我的爱好</div>
      <p>除了上课写作业，课余时间最喜欢：</p>
      <div class="tags">
        <span class="tag">🏀 打篮球</span>
        <span class="tag">⛏️ Minecraft</span>
      </div>
    </section>

    <section class="card">
      <div class="card-title">🚀 最近在做什么</div>
      <p>
        参加交大学森暑期营，用 SSH 连上一块 <span class="highlight">8 核 RISC-V 板子</span>，
        让 AI 智能体在上面写了个 PCR 模拟器，
        从零搭出了一个能跑完整动力学模型的网页工具。
      </p>
      <blockquote>
        「种一棵树最好的时间是十年前，其次是现在。」
      </blockquote>
    </section>

    <footer>
      &copy; 2026 侯雨轩 &middot; Made on RISC-V
    </footer>

  </div>
</body>
</html>
